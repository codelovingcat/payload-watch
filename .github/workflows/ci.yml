name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Run unit and regression tests
        run: npm test

      - name: Verify package exports and consumer types
        run: npm run check:package

      - name: Run documented API examples
        run: node examples/api-reference.mjs

      - name: Verify clean consumer installation
        run: npm run check:consumer

      - name: Check CLI file comparison
        run: npm run test:cli

      - name: Test non-publishing release preflight
        run: npm run test:release-preflight

      - name: Replay post-MVP evaluation scenarios
        run: node scripts/verify-post-mvp-scenarios.mjs

      - name: Verify 0.1.0 release candidate
        run: npm run check:release-candidate

      - name: Verify publication metadata without publishing
        run: npm run release:preflight

  windows-cli:
    name: Windows CLI smoke (Node.js 22)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Run CLI file, format, path and exit-code smoke tests
        run: npm run test:cli
